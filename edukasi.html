<section class="container section education-reading" x-data="library('articles')" aria-labelledby="reading-title"><h2 id="reading-title">Materi lanjutan</h2><p>Baca penjelasan tentang karbon, air, energi, dan kebiasaan penggunaan AI.</p><div class="library-toolbar"><div class="filter-tabs" role="group" aria-label="Filter topik materi"><button type="button" @click="topic = 'semua'" :class="{active: topic === 'semua'}" :aria-pressed="topic === 'semua'">Semua materi</button><button type="button" @click="topic = 'karbon'" :class="{active: topic === 'karbon'}" :aria-pressed="topic === 'karbon'">Karbon</button><button type="button" @click="topic = 'air'" :class="{active: topic === 'air'}" :aria-pressed="topic === 'air'">Air</button><button type="button" @click="topic = 'energi'" :class="{active: topic === 'energi'}" :aria-pressed="topic === 'energi'">Energi</button><button type="button" @click="topic = 'kebiasaan'" :class="{active: topic === 'kebiasaan'}" :aria-pressed="topic === 'kebiasaan'">Kebiasaan</button></div><label class="search-field"><img class="icon" src="/assets/icons/search.svg" alt="" aria-hidden="true"><span class="sr-only">Cari materi</span><input type="search" placeholder="Cari materi…" x-model="query"></label></div><p class="collection-count" role="status"><span x-text="visibleCount">4</span> materi untuk dijelajahi</p><div class="article-grid"><!-- site:articles --></div><div class="empty-state" x-cloak x-show="visibleCount === 0"><h3>Materinya belum ditemukan.</h3><p>Coba kata lain atau tampilkan semua topik.</p><button type="button" class="button button-quiet" @click="clear">Tampilkan semua materi</button></div></section>

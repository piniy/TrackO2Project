<!doctype html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#103f35"><meta name="robots" content="noindex"><meta name="description" content="Lihat aktivitas AI, estimasi dampak, dan koneksi ponselmu di TraCkO₂."><title>Dashboard — TraCkO₂</title><script type="module" src="/src/main.js"></script></head>
<body data-page="dashboard"><!-- site:icons --><!-- site:header -->
<main id="main" class="container account-page dashboard-page" x-data="activityDashboard">
  <div class="dashboard-heading"><div><a href="./index.html" class="text-link">← Beranda</a><h1 x-text="$t('Aktivitas AI-mu')">Aktivitas AI-mu</h1><p class="muted" x-text="$store.account.user?.email ?? ''"></p></div><div class="connection-status" :class="connection"><span class="connection-dot" aria-hidden="true"></span><span role="status" x-text="connectedText"></span></div></div>
  <p class="account-error" role="alert" x-show="error" x-text="error" x-cloak></p><button class="button button-quiet" type="button" x-show="error" @click="$store.account.restore(); refresh()" x-cloak x-text="$t('Coba lagi')">Coba lagi</button>
  <p x-show="loading" role="status" x-text="$t('Memuat aktivitas…')">Memuat aktivitas…</p>
  <template x-if="data"><div>
    <div class="dashboard-stats"><article><p x-text="$t('Aktivitas terkonfirmasi')">Aktivitas terkonfirmasi</p><strong x-text="data.confirmed_count"></strong><span x-text="$t('Dicatat di aplikasi')">Dicatat di aplikasi</span></article><article class="impact-stat"><p x-text="$t('Estimasi dampak')">Estimasi dampak</p><strong><span x-text="data.estimated_g_co2e.toLocaleString(en ? 'en-GB' : 'id-ID', {maximumFractionDigits: 1})"></span> <small>g CO₂e</small></strong><span x-text="$t('Parameter proposal-2026-v1')">Parameter proposal-2026-v1</span></article><article><p x-text="$t('Perlu ditinjau')">Perlu ditinjau</p><strong x-text="data.pending_count"></strong><span x-text="$t('Belum masuk estimasi')">Belum masuk estimasi</span></article></div>
    <p class="estimate-context" x-text="$t('Estimasi edukatif berdasarkan aktivitas yang dicatat pengguna dan parameter proposal. Bukan pengukuran emisi ChatGPT atau Gemini.')">Estimasi edukatif berdasarkan aktivitas yang dicatat pengguna dan parameter proposal. Bukan pengukuran emisi ChatGPT atau Gemini.</p>
    <div class="dashboard-columns"><section class="activity-panel" aria-labelledby="history-heading"><div class="panel-heading"><h2 id="history-heading" x-text="$t('Riwayat aktivitas')">Riwayat aktivitas</h2><span class="small muted" x-show="checkedAt" x-text="checkedAt ? $t('Diperiksa') + ' ' + formatDate(checkedAt) : ''"></span></div>
      <div class="account-empty" x-show="!data.events.length"><span aria-hidden="true">↗</span><h3 x-text="$t('Belum ada aktivitas')">Belum ada aktivitas</h3><p x-text="$t('Hubungkan ponsel dan aktifkan deteksi otomatis di aplikasi TraCkO₂. Aktivitas akan muncul setelah tersinkronisasi.')">Hubungkan ponsel dan aktifkan deteksi otomatis di aplikasi TraCkO₂. Aktivitas akan muncul setelah tersinkronisasi.</p></div>
      <div class="activity-list"><template x-for="event in data.events" :key="(event.device_id ?? '') + event.event_id"><article class="activity-row"><span class="activity-provider" x-text="event.provider === 'chatgpt' ? 'C' : 'G'" aria-hidden="true"></span><div><strong x-text="category(event.category)"></strong><p><span x-text="event.provider === 'chatgpt' ? 'ChatGPT' : 'Gemini'"></span> · <span x-text="formatDate(event.occurred_at)"></span></p><span class="small muted" x-text="event.capture_method === 'manual_entry' ? $t('Dicatat manual') : $t('Terdeteksi otomatis')"></span></div><span class="activity-state" x-text="event.status === 'confirmed' ? $t('Terkonfirmasi') : $t('Perlu ditinjau')"></span></article></template></div><div class="account-history-controls"><button class="button button-quiet" type="button" :disabled="offset === 0" @click="page(-1)" x-text="en ? 'Previous' : 'Sebelumnya'"></button><span class="small muted" x-text="(en ? 'Page ' : 'Halaman ') + (Math.floor(offset / 200) + 1)"></span><button class="button button-quiet" type="button" :disabled="!hasNextPage" @click="page(1)" x-text="en ? 'Next' : 'Berikutnya'"></button></div><p><a class="text-link" href="/v1/export" download x-text="en ? 'Download all account activity (JSON)' : 'Unduh seluruh aktivitas akun (JSON)'"></a></p>
    </section><aside class="dashboard-sidebar"><section class="pair-panel"><span class="pair-symbol" aria-hidden="true">↔</span><h2 x-text="$t('Hubungkan ponsel')">Hubungkan ponsel</h2><p x-text="$t('Pasangkan sekali. Aktivitas baru akan dikirim otomatis saat terhubung ke internet.')">Pasangkan sekali. Aktivitas baru akan dikirim otomatis saat terhubung ke internet.</p><ol><li x-text="$t('Buat kode koneksi di bawah.')">Buat kode koneksi di bawah.</li><li x-text="$t('Di aplikasi, buka Settings → Connect an account.')">Di aplikasi, buka Settings → Connect an account.</li><li x-text="$t('Masukkan alamat server dan kode, lalu pilih Connect and upload.')">Masukkan alamat server dan kode, lalu pilih Connect and upload.</li></ol><p class="small" x-text="$t('Menghubungkan ponsel akan mengunggah riwayat lokalnya ke akun ini.')">Menghubungkan ponsel akan mengunggah riwayat lokalnya ke akun ini.</p><button type="button" class="button" :disabled="pairing" @click="pair" x-text="pairing ? $t('Membuat kode…') : code ? $t('Buat kode baru') : $t('Buat kode koneksi')"></button><div x-show="code" x-cloak><label for="pair-code" x-text="$t('Kode koneksi')">Kode koneksi</label><input id="pair-code" class="pair-code" readonly :value="code" @focus="$event.target.select()"><p class="small" x-text="codeExpires ? $t('Berlaku sampai') + ' ' + formatDate(codeExpires) : ''"></p><label for="server-origin" x-text="$t('Alamat server')">Alamat server</label><input id="server-origin" readonly :value="serverEndpoint" @focus="$event.target.select()"></div><p class="account-error" role="alert" x-text="pairError" x-show="pairError"></p></section>
    <section class="devices-panel"><h2 x-text="$t('Ponsel terhubung')">Ponsel terhubung</h2><p class="small muted" x-show="!data.devices.length" x-text="$t('Belum ada ponsel yang terhubung.')">Belum ada ponsel yang terhubung.</p><template x-for="device in data.devices" :key="device.id"><article class="device-row"><strong x-text="$t('Ponsel') + ' ' + device.id.slice(0,8)"></strong><p class="small muted" x-text="device.last_sync ? $t('Unggahan terakhir') + ': ' + formatDate(device.last_sync) : $t('Menunggu unggahan pertama')"></p><button class="disconnect-button" type="button" :disabled="revoking === device.id" @click="revoke(device)" x-text="$t('Putuskan &amp; hapus data')">Putuskan &amp; hapus data</button></article></template><p class="small muted" x-show="data.devices.length" x-text="$t('Memutuskan ponsel menghapus data unggahannya. Putuskan juga di aplikasi untuk menghapus salinan lokal.')">Memutuskan ponsel menghapus data unggahannya. Putuskan juga di aplikasi untuk menghapus salinan lokal.</p></section></aside></div>
  </div></template><noscript><p>Aktifkan JavaScript untuk melihat dashboard.</p></noscript>
</main><!-- site:footer --></body></html>

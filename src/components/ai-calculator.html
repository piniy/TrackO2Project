<section class="ai-calculator panel" x-data="aiCalculator" aria-labelledby="ai-heading">
  <div class="ai-intro">
    <span class="pill">Gemini API</span>
    <h2 id="ai-heading" x-text="text('Tulis prompt, pahami jejaknya', 'Write a prompt, understand its footprint')">Tulis prompt, pahami jejaknya</h2>
    <p x-text="text('Lihat jawaban Gemini, penggunaan token, dan estimasi karbon berdasarkan faktor yang dikonfigurasi.', 'See Gemini’s response, token usage, and a carbon estimate based on configured factors.')"></p>
  </div>
  <noscript>Aktifkan JavaScript untuk mengirim prompt ke Gemini.</noscript>
  <form @submit.prevent="submit" :aria-busy="busy">
    <label for="ai-prompt" x-text="text('Prompt kamu', 'Your prompt')">Prompt kamu</label>
    <textarea id="ai-prompt" x-model="prompt" maxlength="8000" rows="5" required :disabled="busy" aria-describedby="ai-privacy" :placeholder="text('Contoh: Jelaskan perbedaan energi dan emisi karbon dalam tiga kalimat.', 'Example: Explain the difference between energy and carbon emissions in three sentences.')"></textarea>
    <p id="ai-privacy" class="ai-note" x-text="text('Prompt dikirim ke Google untuk memperoleh jawaban. Jangan masukkan data rahasia. Setiap pengiriman adalah percakapan baru; riwayat tidak dikirim atau disimpan oleh TraCkO2.', 'Your prompt is sent to Google for a response. Do not include secrets. Each submission starts a new conversation; TraCkO2 does not send or store conversation history.')"></p>
    <button class="button" type="submit" :disabled="busy" x-text="busy ? text('Menunggu Gemini…', 'Waiting for Gemini…') : text('Kirim ke Gemini', 'Send to Gemini')">Kirim ke Gemini</button>
    <span role="status" class="ai-note" x-text="busy ? text('Sedang memproses prompt.', 'Processing your prompt.') : ''"></span>
    <p class="form-error" role="alert" x-cloak x-show="error" x-text="errorMessage"></p>
  </form>
  <section x-cloak x-show="result" class="ai-response" tabindex="-1" x-ref="aiResult" aria-labelledby="ai-answer-title">
    <h3 id="ai-answer-title" x-text="text('Hasil permintaan terakhir yang berhasil', 'Last successful request')"></h3>
    <details><summary x-text="text('Prompt yang dikirim', 'Submitted prompt')"></summary><p class="ai-answer" x-text="submittedPrompt"></p></details>
    <p class="ai-note"><span x-text="result?.modelVersion || result?.model"></span></p>
    <p x-show="result?.blocked" x-text="text('Gemini memblokir respons untuk prompt ini.', 'Gemini blocked the response for this prompt.')"></p>
    <p x-show="result && !result.answer && !result.blocked" x-text="text('Gemini tidak mengembalikan jawaban teks.', 'Gemini returned no text response.')"></p>
    <div class="ai-answer" x-text="result?.answer"></div>
    <p class="ai-note" x-show="result?.finishReason === 'MAX_TOKENS'" x-text="text('Jawaban mencapai batas token dan mungkin terpotong.', 'The response reached the token limit and may be incomplete.')"></p>
    <dl class="ai-usage">
      <div><dt>Input tokens</dt><dd x-text="number(result?.usage.inputTokens)"></dd></div>
      <div><dt>Output tokens</dt><dd x-text="number(result?.usage.outputTokens)"></dd></div>
      <div><dt>Thinking tokens</dt><dd x-text="number(result?.usage.thinkingTokens)"></dd></div>
      <div><dt>Cached input tokens</dt><dd x-text="number(result?.usage.cachedTokens)"></dd></div>
      <div><dt>Total tokens</dt><dd x-text="number(result?.usage.totalTokens)"></dd></div>
    </dl>
    <p class="ai-note" x-text="text('Cached input merupakan bagian dari input, bukan tambahan. Token thinking ditampilkan terpisah dari output. Metadata opsional yang tidak dilaporkan ditampilkan sebagai 0; total diperiksa sebelum estimasi dihitung.', 'Cached input is part of input, not an addition. Thinking tokens are separate from output. Unreported optional counts are shown as 0; the total is checked before estimating.')"></p>
    <div class="ai-emissions">
      <h3 x-text="text('Estimasi emisi berbasis token', 'Token-based emissions estimate')"></h3>
      <p x-show="result?.emissions.status !== 'estimated'" x-text="emissionNotice"></p>
      <template x-if="result?.emissions.status === 'estimated'">
        <div>
          <strong class="ai-carbon"><span x-text="number(result.emissions.gramsCO2e, 8)"></span> g CO₂e</strong>
          <p x-text="text('Estimasi skenario, bukan pengukuran emisi aktual dari Google.', 'A scenario estimate, not an actual emissions measurement from Google.')"></p>
          <dl class="ai-factor-details">
            <dt x-text="text('Versi faktor', 'Factor version')"></dt><dd x-text="result.emissions.factorVersion"></dd>
            <dt x-text="text('Sumber faktor', 'Factor source')"></dt><dd x-text="result.emissions.source"></dd>
            <dt x-text="text('Cakupan perhitungan', 'System boundary')"></dt><dd x-text="result.emissions.boundary"></dd>
          </dl>
          <details><summary x-text="text('Rincian faktor dan emisi', 'Factor and emissions breakdown')"></summary>
            <template x-for="row in result.emissions.breakdown" :key="row.type"><p><span x-text="row.type"></span>: <span x-text="number(row.tokens)"></span> tokens × <span x-text="number(row.gramsPerThousandTokens, 8)"></span> g CO₂e / 1.000 → <span x-text="number(row.gramsCO2e, 8)"></span> g CO₂e</p></template>
          </details>
        </div>
      </template>
    </div>
  </section>
  <details class="ai-method"><summary x-text="text('Bagaimana estimasinya dihitung?', 'How is the estimate calculated?')"></summary>
    <p x-text="text('Emisi = jumlah (token setiap jenis ÷ 1.000 × faktor jenis tersebut). Input tanpa cache, input cache, output, dan thinking dihitung terpisah. Faktor harus sesuai model, sumber, dan cakupan yang dipilih pengelola.', 'Emissions = sum of (tokens of each type ÷ 1,000 × that type’s factor). Uncached input, cached input, output, and thinking are calculated separately. Factors must match the model, source, and system boundary selected by the operator.')"></p>
    <p x-text="text('Jumlah token berasal dari metadata API. Nilai karbon adalah estimasi dengan asumsi; Gemini tidak memberikan pengukuran karbon per permintaan. Faktor kalkulator aktivitas di bawah tidak digunakan untuk menghitung token.', 'Token counts come from API metadata. Carbon is an estimate based on assumptions; Gemini does not provide a carbon measurement per request. The activity calculator factors below are not used for tokens.')"></p>
    <a href="https://ai.google.dev/api/generate-content#UsageMetadata" target="_blank" rel="noopener noreferrer">Gemini usage metadata ↗</a>
  </details>
</section>

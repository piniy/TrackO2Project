<header class="site-header" x-data="{ menuOpen: false }" @keydown.escape.window="if (menuOpen) { menuOpen = false; $refs.menu.focus() }">
  <div class="header-inner container">
    <a class="brand" href="./index.html" aria-label="TraCkO2 beranda"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-leaf"></use></svg></span><span>TraCkO<span class="brand-two">2</span><span class="brand-dot">.</span></span></a>
    <nav class="primary-nav" id="primary-nav" aria-label="Navigasi utama" :class="{ 'is-open': menuOpen }">
      <a data-page="home" href="./index.html">Beranda</a>
      <a data-page="education" href="./edukasi.html">Edukasi</a>
      <a data-page="calculator" href="./kalkulator.html">CarbsCulator</a>
      <a data-page="campaign" href="./kampanye.html">Kampanye</a>

      <a data-page="game" href="./game.html">Game</a>

    <div class="header-controls">
      <div class="language-switch" role="group" aria-label="Pilih bahasa" x-cloak>
        <button type="button" lang="id" aria-label="Bahasa Indonesia" :aria-pressed="$store.i18n.locale === 'id'" @click="$store.i18n.setLocale('id')">ID</button>
        <button type="button" lang="en" aria-label="English" :aria-pressed="$store.i18n.locale === 'en'" @click="$store.i18n.setLocale('en')">EN</button>
      </div>
      <button class="menu-toggle" type="button" x-ref="menu" @click="menuOpen = !menuOpen" :aria-expanded="menuOpen" aria-expanded="false" aria-controls="primary-nav" aria-label="Menu"><svg class="icon" aria-hidden="true"><use href="#i-menu"></use></svg><span>Menu</span></button>
    </div>
    <span class="sr-only" role="status" x-text="$store.i18n.announcement"></span>
  </div>
</header>

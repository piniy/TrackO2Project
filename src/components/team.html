<section class="team-section" id="tentang" aria-labelledby="team-heading" x-data="teamProfiles">
  <div class="team-smoke" aria-hidden="true">
    <span class="team-smoke-billow"></span>
    <span class="team-smoke-billow"></span>
    <span class="team-smoke-billow"></span>
    <span class="team-smoke-billow"></span>
    <span class="team-smoke-billow"></span>
  </div>
  <div class="container">
    <div class="team-section-heading">
      <h2 id="team-heading">About Team</h2>
      <p>Kenali tim di balik TraCkO2.</p>
    </div>
    <div class="team-portraits" tabindex="0" role="region" aria-label="Anggota tim TraCkO2">
      <template x-for="(member, index) in members" :key="member.id">
        <button class="team-card" type="button" :class="{ 'is-active': activeIndex === index }" :aria-pressed="activeIndex === index" @click="activeIndex = activeIndex === index ? null : index">
          <span class="team-profile-image">
            <template x-if="member.photo"><img :src="member.photo" :style="{ '--portrait-scale': member.photoScale || 1, '--portrait-focus': member.photoFocus || '50% 30%' }" alt="" loading="lazy" width="480" height="600"></template>
            <template x-if="!member.photo"><span class="team-profile-placeholder" aria-hidden="true" x-text="member.initials"></span></template>
          </span>
          <span class="team-profile-label" x-text="$t(member.name)"></span>
          <span class="team-card-role" x-text="member.jobDesk"></span>
        </button>
      </template>
    </div>
  </div>
</section>
